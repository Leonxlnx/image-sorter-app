name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like PhotoSwipe to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you have tried or other approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require adding internet access, analytics, or tracking.
          required: true
        - label: This does not break the core 4-way swipe semantics.
          required: true
